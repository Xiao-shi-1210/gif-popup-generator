<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>动态弹窗工具 - T0工作台</title>
<style>

  @font-face{
    font-family:'AaHouDiHei';
    src:local('Aa厚底黑'), url('./assets/fonts/Aa厚底黑(2).ttf') format('truetype');
    font-display:block;
    font-weight:400;
  }
  @font-face{
    font-family:'AlibabaPuHuiTiBlack';
    src:local('Alibaba PuHuiTi 2.0 115 Black'), local('阿里巴巴普惠体 115 Black'), url('./assets/fonts/Alibaba_PuHuiTi_2.0_115_Black_115_Black.ttf') format('truetype');
    font-display:block;
    font-weight:400;
  }
  @font-face{
    font-family:'AlimamaShuHeiTi';
    src:local('Alimama ShuHeiTi'), local('阿里妈妈数黑体'), url('./assets/fonts/Alimama_ShuHeiTi_Bold.ttf') format('truetype');
    font-display:block;
    font-weight:400;
  }

  :root{
    --bg:#f6f8fb;
    --card:rgba(255,255,255,.84);
    --panel-soft:rgba(255,255,255,.68);
    --text:#111111;
    --sub:#737780;
    --line:rgba(17,24,39,.08);
    --soft:#f5f6f8;
    --blue:#2563eb;
    --blue-hover:#1d4ed8;
    --green:#16a34a;
    --green-hover:#15803d;
    --orange:#f97316;
    --red:#ef4444;
    --radius:20px;
    --shadow:0 18px 46px rgba(15,23,42,.06);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 12% 0%, rgba(37,99,235,.08), transparent 28%),
      radial-gradient(circle at 88% 12%, rgba(22,163,74,.07), transparent 26%),
      linear-gradient(180deg, #fbfcff 0%, var(--bg) 100%);
    padding:20px;
  }

  .page{width:934px;max-width:934px;margin:0 auto}
  .topbar{
    margin:0 auto 14px;
    min-height:74px;
    padding:14px 16px;
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    align-items:center;
    gap:12px;
    background:rgba(255,255,255,.64);
    border:1px solid rgba(17,24,39,.07);
    border-radius:22px;
    box-shadow:var(--shadow);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }
  .brand-mark{
    width:40px;height:40px;display:grid;place-items:center;flex:0 0 auto;
    border-radius:14px;
    background:rgba(17,17,17,.045);
    color:#171717;
    border:1px solid rgba(17,17,17,.06);
    padding:8px;
  }
  .brand-mark img{width:100%;height:100%;display:block}
  .brand-mark svg{width:100%;height:100%;display:block;color:currentColor}
  .brand h1{
    margin:0;
    font-size:14px;
    line-height:1.25;
    letter-spacing:-.2px;
    white-space:nowrap;
  }
  .brand p{
    margin:3px 0 0;
    color:var(--sub);
    font-size:11.5px;
    line-height:1.35;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .tool-title{
    text-align:right;
    min-width:0;
    max-width:180px;
    justify-self:end;
    overflow:hidden;
  }
  .tool-title strong{
    display:block;
    font-size:16px;
    letter-spacing:-.2px;
    line-height:1.12;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tool-title span{display:none}

  .app{
    display:grid;
    grid-template-columns:500px 420px;
    gap:14px;
    align-items:stretch;
    justify-content:center;
  }

  .card{
    background:var(--card);
    border:1px solid rgba(17,24,39,.075);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    height:100%;
  }

  .panel-title{
    min-height:50px;
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.54);
  }
  .panel-title h2{
    margin:0;
    font-size:14px;
    font-weight:900;
  }
  .panel-title small{
    color:var(--sub);
    font-size:12px;
    font-weight:700;
  }

  .left .preview-tools{
    padding:12px 16px 0;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .left .preview-body{
    padding:16px;
    background:
      linear-gradient(45deg, #f1f5f9 25%, transparent 25%),
      linear-gradient(-45deg, #f1f5f9 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #f1f5f9 75%),
      linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
    background-size:18px 18px;
    background-position:0 0, 0 9px, 9px -9px, -9px 0;
  }

  .checker{
    width:100%;
    aspect-ratio:600/840;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:18px;
    border:1.5px dashed rgba(148,163,184,.62);
    background:rgba(255,255,255,.74);
  }
  .checker.empty,
  .checker.has-image{
    background:
      linear-gradient(45deg,#f1f5f9 25%,transparent 25%),
      linear-gradient(-45deg,#f1f5f9 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#f1f5f9 75%),
      linear-gradient(-45deg,transparent 75%,#f1f5f9 75%);
    background-color:rgba(255,255,255,.75);
    background-size:18px 18px;
    background-position:0 0,0 9px,9px -9px,-9px 0;
  }


  .checker{position:relative}
  .emptyHint{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    padding:22px;
  }
  .checker.empty .emptyHint{display:flex}
  .emptyHintCard{
    width:min(100%, 260px);
    padding:18px 16px 17px;
    border-radius:22px;
    background:rgba(255,255,255,.72);
    border:1px solid rgba(17,24,39,.06);
    box-shadow:0 8px 20px rgba(15,23,42,.045);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    text-align:center;
  }
  .emptyHintIcon{
    width:62px;
    height:62px;
    margin:0 auto 14px;
    display:block;
    color:#94a3b8;
  }
  .emptyHintTitle{
    margin:0;
    color:#111111;
    font-size:16px;
    line-height:1.25;
    font-weight:900;
    letter-spacing:-.2px;
  }
  .emptyHintSub{
    margin:8px 0 0;
    color:#737780;
    font-size:12px;
    line-height:1.55;
    font-weight:600;
  }

  #stage{width:100%;height:auto;display:block;aspect-ratio:600/840;cursor:grab}
  #stage.buttonHover{cursor:move}
  #stage.dragging{cursor:grabbing}

  .progress{
    margin-top:12px;
    height:8px;
    border-radius:999px;
    background:#eef2f7;
    overflow:hidden;
    display:none;
  }
  .progress span{
    display:block;
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#2f6df4 0%, var(--blue) 100%);
    transition:width .16s linear;
  }

  .status{
    display:none;
    margin-top:10px;
    padding:8px 10px;
    border-radius:12px;
    background:#eef2f7;
    color:#475569;
    font-size:12px;
    line-height:1.55;
  }
  .status:not(:empty){display:block}

  .right-body{
    padding:14px;
    display:grid;
    gap:12px;
  }
  .section{
    padding:12px;
    border:1px solid var(--line);
    border-radius:16px;
    background:var(--panel-soft);
    margin-bottom:0;
  }

  .sectionHead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .section h3{
    margin:0;
    font-size:13px;
    font-weight:900;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section h3 b{
    width:22px;height:22px;display:grid;place-items:center;
    border-radius:8px;background:#eff6ff;color:var(--blue);
    font-size:12px;flex:0 0 auto;
  }

  .grid2,.grid3{
    display:grid;
    gap:8px;
    margin-bottom:8px;
  }
  .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid2:last-child,.grid3:last-child{margin-bottom:0}

  label{
    display:block;
    font-size:12px;
    color:#475569;
    margin-bottom:5px;
  }

  input[type="text"],
  input[type="number"],
  select{
    width:100%;
    height:38px;
    border:1px solid rgba(17,24,39,.08);
    border-radius:12px;
    background:#fff;
    color:var(--text);
    padding:0 11px;
    outline:none;
    font-size:13px;
    transition:.16s ease;
  }
  input[type="text"]:focus,
  input[type="number"]:focus,
  select:focus{
    border-color:#93c5fd;
    box-shadow:0 0 0 3px rgba(59,130,246,.12);
  }

  input[type="range"]{width:100%}
  input[type="color"]{
    width:100%;height:38px;border:1px solid rgba(17,24,39,.08);
    border-radius:12px;background:#fff;padding:4px;
    overflow:hidden;
    appearance:none;
    -webkit-appearance:none;
  }
  input[type="color"]::-webkit-color-swatch-wrapper{
    padding:0;
    border-radius:9px;
    overflow:hidden;
  }
  input[type="color"]::-webkit-color-swatch{
    border:none;
    border-radius:9px;
  }
  input[type="color"]::-moz-color-swatch{
    border:none;
    border-radius:9px;
  }
  .colorRow{
    align-items:end;
    gap:10px;
  }
  .colorRow input[type="color"]{
    height:34px;
    border-radius:10px;
  }
  .hintTiny{font-size:11px;color:#94a3b8;line-height:1.45;margin-top:4px}
  .modeTag{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border:1px dashed rgba(148,163,184,.35);border-radius:14px;background:rgba(248,250,252,.7);font-size:12px;color:#64748b;line-height:1.45}
  .customBtnPanel{display:none;margin-top:8px}
  .customBtnPanel.show{display:block}
  .basicBtnControls.hide{display:none}
  .textControls.hide{display:none}


  .toggle{
    min-height:38px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 2px;
    font-size:12px;
    color:#475569;
  }

  button,.fileBtn,.top-link{
    height:38px;
    border:0;
    border-radius:12px;
    padding:0 12px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    font-size:13px;
    font-weight:900;
    transition:.15s ease;
    text-decoration:none;
    font-family:inherit;
  }

  .fileBtn,.top-link{
    background:linear-gradient(180deg, #2f6df4 0%, var(--blue) 100%);
    color:#fff;
    box-shadow:0 10px 20px rgba(37,99,235,.18);
  }
  .fileBtn:hover,.top-link:hover{
    background:linear-gradient(180deg, #2b65df 0%, var(--blue-hover) 100%);
    transform:translateY(-1px);
  }

  button.secondary{
    background:#eef2f7;
    color:#253044;
    border:1px solid rgba(17,24,39,.08);
  }
  button.secondary:hover{transform:translateY(-1px)}
  button.blue{
    background:linear-gradient(180deg, #2f6df4 0%, var(--blue) 100%);
    color:#fff;
    box-shadow:0 10px 20px rgba(37,99,235,.18);
  }
  button.green{
    background:linear-gradient(180deg, #19b257 0%, var(--green) 100%);
    color:#fff;
    box-shadow:0 10px 20px rgba(22,163,74,.16);
  }
  button.blue:hover,button.green:hover{transform:translateY(-1px)}

  .miniAdvBtn{
    height:28px;
    border-radius:9px;
    padding:0 10px;
    background:#f1f5f9;
    color:#334155;
    border:1px solid rgba(17,24,39,.08);
    font-size:12px;
    font-weight:800;
    box-shadow:none;
  }
  .miniAdvBtn.active{
    background:#dbeafe;
    color:#1d4ed8;
    border-color:#93c5fd;
  }

  .layerAdvanced{
    display:none;
    margin-top:8px;
    padding:10px;
    border:1px dashed #dbe4f0;
    border-radius:12px;
    background:#f8fafc;
  }
  .layerAdvanced.show{display:block}

  input[type="file"]{display:none}
  .actions,.btnRow,.presetRow{display:flex;flex-wrap:wrap;gap:8px}
  .preset{
    flex:1;min-width:0;color:#fff;border:0;height:34px;border-radius:10px;
    font-size:12px;font-weight:800;
  }
  .blue1{background:linear-gradient(90deg,#2f7cff,#00c6ff)}
  .blue2{background:linear-gradient(90deg,#0f4cff,#7ee8ff)}
  .orange{background:linear-gradient(90deg,#ffe84a,#ff3c00)}
  .checkTitle{
    min-height:38px;
    display:flex;
    align-items:end;
    gap:8px;
    font-size:12px;
    color:#475569;
    padding-bottom:4px;
  }

  .exportBtn{
    height:auto;
    min-height:52px;
    padding:8px 14px;
    flex:1;
    min-width:0;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    line-height:1.15;
  }
  .exportBtn small{
    display:block;
    margin-top:4px;
    font-size:11px;
    font-weight:700;
    opacity:.86;
  }
  .section.exportSection{
    padding:10px 12px 12px;
  }
  .section.exportSection h3{
    margin-bottom:6px;
  }
  .section.exportSection .btnRow{
    gap:8px;
    margin-top:2px;
  }
  .section.exportSection .exportBtn{
    min-height:48px;
    padding:7px 12px;
  }

  @media (max-width:1120px){
    .app{grid-template-columns:1fr;align-items:start}
  }
  @media (max-width:980px){
    .page{width:auto;max-width:100%}
    .topbar{grid-template-columns:1fr;align-items:flex-start}
    .tool-title{text-align:left;min-width:0;justify-self:start}
    .tool-title strong{white-space:normal}
    .app{grid-template-columns:1fr;align-items:start}
  }
  @media (max-width:680px){
    body{padding:12px}
    .grid2,.grid3{grid-template-columns:1fr}
    .left .preview-tools{padding:12px}
    .left .preview-body{padding:12px}
  }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-label="T0工作台 Logo"><img src="./assets/t0-logo.svg" alt="T0工作台"></div>
      <div>
        <h1>T0工作台</h1>
        <p>为自己，也为同频的朋友做点顺手工具</p>
      </div>
    </div>
    <div class="tool-title">
      <strong>动态弹窗工具</strong>
    </div>
  </div>

  <div class="app">
    <div class="card left">
      <div class="panel-title">
        <h2>实时预览</h2>
        <small>输出以此为准</small>
      </div>
      <div class="preview-tools">
        <label class="fileBtn" for="imageInput">上传图片</label>
        <a class="top-link" href="https://www.koukoutu.com" target="_blank" rel="noopener noreferrer">点击抠图</a>
        <button class="secondary" id="fitBtn">铺满</button>
        <button class="secondary" id="centerBtn">居中</button>
        
      </div>
      <div class="preview-body">
        <div class="checker empty" id="previewBox">
          <canvas id="stage" width="600" height="840"></canvas>
          <div class="emptyHint" aria-hidden="true">
            <div class="emptyHintCard">
              <svg class="emptyHintIcon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="8.75" y="8.75" width="46.5" height="46.5" rx="14" fill="rgba(255,255,255,.58)" stroke="currentColor" stroke-opacity=".24" stroke-width="1.5"/>
                <path d="M32 18.5V34.5" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M25.5 25.5L32 18.5L38.5 25.5" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M22 39.5H42" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
              </svg>
              <p class="emptyHintTitle">上传素材</p>
              <p class="emptyHintSub">点击上传 / 拖入图片 / Ctrl+V 粘贴</p>
            </div>
          </div>
        </div>
        <div class="progress" id="progress"><span id="progressBar"></span></div>
        <div class="status" id="status"></div>
      </div>
    </div>

    <div class="card right">
      <div class="panel-title">
        <h2>参数设置</h2>
        
      </div>
      <div class="right-body">
        <div class="section">
          <div class="sectionHead">
            <h3><b>01</b>图片图层</h3>
            <button class="miniAdvBtn" id="imgAdvancedBtn" type="button">高级</button>
          </div>
          <div class="grid2">
            <div><label>圆角</label><select id="maskRadius"><option value="24" selected>24</option><option value="48">48</option><option value="72">72</option></select></div>
            <div><label>缩放</label><input type="range" id="imgScale" min="30" max="300" value="100"></div>
          </div>
          <div class="layerAdvanced" id="imgAdvancedPanel">
            <div class="grid2">
              <div><label>底部淡出</label><input type="range" id="imgFadeBottom" min="0" max="360" value="0"></div>
              <div><label>镜像</label><div class="toggle"><input type="checkbox" id="imgMirror"><span>水平镜像</span></div></div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="sectionHead">
            <h3><b>02</b>按钮</h3>
            <button class="miniAdvBtn" id="btnAdvancedBtn" type="button">高级</button>
          </div>

          <div class="grid2">
            <div><label>模式</label><select id="buttonMode"><option value="basic" selected>基础样式</option><option value="custom">自定义上传</option></select></div>
            <div><label>动画频率</label><select id="animSpeed"><option value="1.1">快</option><option value="1.6" selected>中</option><option value="2.2">慢</option></select></div>
          </div>

          <div class="grid2">
            <div><label>按钮 X</label><input type="number" id="btnX" value="99" step="1"></div>
            <div><label>按钮 Y</label><input type="number" id="btnY" value="676" step="1"></div>
          </div>

          <div id="basicBtnControls" class="basicBtnControls">
            <div class="presetRow" style="margin-bottom:8px">
              <button class="preset blue1" data-preset="blue1">蓝 1</button>
              <button class="preset blue2" data-preset="blue2">蓝 2</button>
              <button class="preset orange" data-preset="orange">橙</button>
            </div>

            <div class="grid3 colorRow">
              <div><label>A</label><input type="color" id="gradA" value="#2f7cff"></div>
              <div><label>B</label><input type="color" id="gradB" value="#00c6ff"></div>
              <div><label>角度</label><input type="number" id="gradAngle" value="90" min="0" max="360"></div>
            </div>

            <div class="layerAdvanced" id="btnAdvancedPanel">
              <div class="grid3">
                <div class="checkTitle"><input type="checkbox" id="strokeOn" checked><span>描边</span></div>
                <div><label>粗细</label><select id="strokePreset"><option value="3" selected>3</option><option value="5">5</option></select></div>
                <div class="checkTitle"></div>
              </div>
              <div class="grid3">
                <div class="checkTitle"><input type="checkbox" id="shineOn"><span>扫光</span></div>
                <div><label>强弱</label><select id="shinePower"><option value="0.55">弱</option><option value="0.8" selected>中</option><option value="1.1">强</option></select></div>
                <div class="checkTitle"></div>
              </div>
              <div class="grid3">
                <div class="checkTitle"><input type="checkbox" id="shadowOn"><span>投影</span></div>
                <div><label>色系</label><select id="shadowPreset"><option value="gray" selected>淡灰</option><option value="warm">暖色</option><option value="cool">冷色</option></select></div>
                <div class="checkTitle"></div>
              </div>
            </div>
          </div>

          <div id="customBtnPanel" class="customBtnPanel">
            <div class="grid2">
              <div><label>上传按钮</label><button class="secondary" id="buttonImageImportBtn" type="button" style="width:100%">选择按钮图片</button></div>
              <div><label>尺寸说明</label><div class="modeTag">推荐 500 × 100 px，工具会自动适配到当前按钮区域。</div></div>
            </div>
            <div class="hintTiny">自定义上传按钮保留：拖动、呼吸动画、导出 GIF。按钮高级、字体高级都不生效。</div>
          </div>
        </div>

        <div class="section" id="textSection">
          <div class="sectionHead">
            <h3><b>03</b>文字</h3>
            <button class="miniAdvBtn" id="textAdvancedBtn" type="button">高级</button>
          </div>

          <div id="textControls" class="textControls">
            <div class="grid2">
              <div><label>文字</label><input type="text" id="btnText" value="立即领取"></div>

  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;
  ctx.fillStyle = spec.textColor || '#ffffff';

  if(spec.italic){
    ctx.save();
    ctx.translate(cx, ty);
    ctx.transform(1, 0, -0.06, 1, 0, 0);
    ctx.fillText(spec.text, 0, 0);
    ctx.restore();

    const fit = buttonCustomImg
      ? fitSizeByRatio(buttonCustomNatural.w, buttonCustomNatural.h, BUTTON_ONLY_W/(1+b.amp), BUTTON_ONLY_H/(1+b.amp))

      x:BUTTON_ONLY_W/2-fit.w/2,

      w:Math.max(20, fit.w),
      h:Math.max(20, fit.h),
      amp:b.amp,
      period:b.period
    };
  }

  const maxScale=1+Math.max(0,b.amp);
  const safe=Math.max(6, b.strokeW * 2 + 3);

  fillW=Math.max(20,fillW);
  fillH=Math.max(20,fillH);

    mode:'basic',
    x:BUTTON_ONLY_W/2-fillW/2,
    y:BUTTON_ONLY_H/2-fillH/2,
    w:fillW,
    h:fillH,
    text:b.text,

function applyCenterDampingToImage(strength=0.16, threshold=42){
  if(!img) return false;
  const iw=imgNatural.w*imgState.scale;
  const ih=imgNatural.h*imgState.scale;
  const cx=imgState.x+iw/2;
  const cy=imgState.y+ih/2;
  const dx=CANVAS_W/2-cx;
  const dy=CANVAS_H/2-cy;
  let hit=false;

  if(Math.abs(dx)<threshold){
    snapGuide.showV=true;
    imgState.x += dx*strength;
    hit=true;
  }
  if(Math.abs(dy)<threshold){
    snapGuide.showH=true;
    imgState.y += dy*strength;
    hit=true;
  }
  return hit;
}

function applyCenterDampingToButton(strength=0.18, threshold=42){
  const size = getActiveButtonBaseSize();
  const cx=buttonState.x+size.w/2;
  const cy=buttonState.y+size.h/2;
  const dx=CANVAS_W/2-cx;
  const dy=CANVAS_H/2-cy;
  let hit=false;

  if(Math.abs(dx)<threshold){
    snapGuide.showV=true;
    buttonState.x += dx*strength;
    hit=true;
  }
  if(Math.abs(dy)<threshold){
    snapGuide.showH=true;
    buttonState.y += dy*strength;
    hit=true;
  }

  if(hit){
    clampButtonPosition();
    syncButtonUI();
  }
  return hit;
}

const BAYER4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
class ByteArray{ constructor(){ this.data=[]; } writeByte(v){ this.data.push(v & 255); } writeShort(v){ this.writeByte(v & 255); this.writeByte((v >> 8) & 255); } writeBytes(arr){ for(let i=0;i<arr.length;i++) this.writeByte(arr[i]); } writeString(s){ for(let i=0;i<s.length;i++) this.writeByte(s.charCodeAt(i)); } toBlob(){ return new Blob([new Uint8Array(this.data)], {type:'image/gif'}); } }
function hexToRgb(hex){ const h=hex.replace('#',''); return {r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16)}; }
function colorDistSq(r1,g1,b1,r2,g2,b2){ return (r1-r2)**2 + (g1-g2)**2 + (b1-b2)**2; }
let paletteSerial=0; function attachPaletteId(palette){ palette._id = ++paletteSerial; return palette; }
function buildPaletteFromBins(bins, transparent, btnConfig, mode='mixed'){
  const palette=[], used=[];
  if(transparent){
    // index 0 是透明色，实际颜色不参与显示
    palette.push(255,255,255);
    used.push([255,255,255]);
  }

  function pushColor(r,g,b,minDist=8){
    r=clamp(Math.round(r),0,255);
    g=clamp(Math.round(g),0,255);
    b=clamp(Math.round(b),0,255);
    for(const c of used){
      if(colorDistSq(r,g,b,c[0],c[1],c[2]) < minDist*minDist) return;
    }
    if(palette.length >= 256*3) return;
    palette.push(r,g,b);
    used.push([r,g,b]);
  }

  const ga=hexToRgb(btnConfig.gradA), gb=hexToRgb(btnConfig.gradB), tc=hexToRgb(btnConfig.textColor), sc=hexToRgb(btnConfig.strokeColor);

  // 给按钮渐变更多“专用色阶”，避免导出后出现割裂色块。
  const rampCount = mode==='button' ? 156 : 112;
  for(let i=0;i<rampCount;i++){
    const t=i/(rampCount-1);
    pushColor(
      ga.r+(gb.r-ga.r)*t,
      ga.g+(gb.g-ga.g)*t,
      ga.b+(gb.b-ga.b)*t,
      mode==='button' ? 3 : 5
    );
  }

  // 保护文字、描边、高光常用色
  pushColor(tc.r,tc.g,tc.b,3);
  pushColor(sc.r,sc.g,sc.b,3);
  pushColor(255,255,255,3);
  pushColor(250,250,250,3);
  pushColor(245,245,245,3);
  pushColor(235,235,235,4);

  const entries=[...bins.values()].sort((a,b)=>b.count-a.count);
  for(const e of entries){
    if(palette.length >= 256*3) break;
    pushColor(e.r/e.count,e.g/e.count,e.b/e.count,mode==='button' ? 5 : 7);
  }

  // 如果因为距离去重没塞满，再放宽距离补齐，减少背景断层
  for(const e of entries){
    if(palette.length >= 256*3) break;
    pushColor(e.r/e.count,e.g/e.count,e.b/e.count,2);
  }

  while(palette.length < 256*3) palette.push(255,255,255);
  return palette.slice(0,256*3);
}

function collectCanvasBins(canvas, transparent, step=1){
  const cctx=canvas.getContext('2d',{willReadFrequently:true});
  const data=cctx.getImageData(0,0,canvas.width,canvas.height).data;
  const bins=new Map();
  step=Math.max(1, step|0);

  for(let py=0; py<canvas.height; py+=step){
    for(let px=0; px<canvas.width; px+=step){
      const idx=(py*canvas.width+px)*4;
      const a=data[idx+3];

      // GIF 是 1bit 透明：半透明边缘直接做阈值，避免被白底合成出大白边/外描边。
      if(transparent && a<128) continue;

      const r=data[idx], g=data[idx+1], b=data[idx+2];
      const key=((r>>3)<<10)|((g>>3)<<5)|(b>>3);
      let item=bins.get(key);
      if(!item){
        item={count:0,r:0,g:0,b:0};
        bins.set(key,item);
      }
      item.count++;
      item.r+=r;
      item.g+=g;
      item.b+=b;
    }
  }
  return bins;
}

function buildProtectedPaletteFromCanvas(canvas, transparent, btnConfig, mode='mixed'){
  const bins=collectCanvasBins(canvas, transparent, mode==='button' ? 1 : 2);
  return buildPaletteFromBins(bins, transparent, btnConfig, mode);
}

function buildProtectedPaletteFromSampledFrames(makeCanvasFn, sampleCount, transparent, btnConfig, mode='mixed'){
  const bins=new Map();

  function mergeBins(source){
    for(const [key,item] of source.entries()){
      let target=bins.get(key);
      if(!target){
        target={count:0,r:0,g:0,b:0};
        bins.set(key,target);
      }
      target.count += item.count;
      target.r += item.r;
      target.g += item.g;
      target.b += item.b;
    }
  }

  for(let i=0;i<sampleCount;i++){
    const t = sampleCount === 1 ? 0 : i/(sampleCount-1);
    const c = makeCanvasFn(t);
    mergeBins(collectCanvasBins(c, transparent, mode==='button' ? 1 : 3));
  }

  return buildPaletteFromBins(bins, transparent, btnConfig, mode);
}

function nearestPaletteIndex(r,g,b,palette, transparent){ let start=transparent ? 1 : 0, best=start, bestD=Infinity; for(let i=start;i<256;i++){ const pr=palette[i*3], pg=palette[i*3+1], pb=palette[i*3+2]; const d=colorDistSq(r,g,b,pr,pg,pb); if(d < bestD){ bestD=d; best=i; } } return best; }
function canvasToIndexedAdaptive(canvas,x,y,w,h,palette,transparent=false,dithering=true,ditherStrength=9){
  const cctx=canvas.getContext('2d',{willReadFrequently:true});
  const data=cctx.getImageData(x,y,w,h).data;
  const out=new Uint8Array(w*h);
  const cache=new Map();

  for(let py=0; py<h; py++){
    for(let px=0; px<w; px++){
      const i=py*w+px, idx=i*4;
      let r=data[idx], g=data[idx+1], b=data[idx+2], a=data[idx+3];

      // 关键：GIF 透明只有开/关。低透明度直接透明，避免白色粗边。
      if(transparent && a<128){
        out[i]=0;
        continue;
      }

      // 不再把半透明边缘合成到白底，直接用原像素色，减少外描边和脏白边。
      const nearWhite = r > 240 && g > 240 && b > 240;
      const lowSat = Math.max(r,g,b) - Math.min(r,g,b) < 6;

      if(dithering && !nearWhite && !lowSat && ditherStrength>0){
        const d=(BAYER4[py & 3][px & 3]/15 - 0.5);
        r=clamp(Math.round(r + d*ditherStrength),0,255);
        g=clamp(Math.round(g + d*ditherStrength),0,255);
        b=clamp(Math.round(b + d*ditherStrength),0,255);
      }

      const key=(r<<16)|(g<<8)|b|(transparent ? 1<<24 : 0);
      let palIndex=cache.get(key);
      if(palIndex==null){
        palIndex=nearestPaletteIndex(r,g,b,palette,transparent);
        cache.set(key,palIndex);
      }
      out[i]=palIndex;
    }
  }
  return out;
}

function lzwRawEncode(indices){ const clear=256, end=257, codeSize=9, bytes=[]; let cur=0,bits=0,count=0; function put(code){ cur |= code << bits; bits += codeSize; while(bits >= 8){ bytes.push(cur & 255); cur >>= 8; bits -= 8; } } put(clear); for(let i=0;i<indices.length;i++){ if(count>=200){ put(clear); count=0; } put(indices[i]); count++; } put(end); if(bits>0) bytes.push(cur & 255); return bytes; }
function writeSubBlocks(ba, bytes){ let o=0; while(o<bytes.length){ const n=Math.min(255, bytes.length-o); ba.writeByte(n); for(let i=0;i<n;i++) ba.writeByte(bytes[o+i]); o+=n; } ba.writeByte(0); }
class GIFWriter{ constructor(w,h,palette){ this.w=w; this.h=h; this.palette=palette; this.ba=new ByteArray(); this.started=false; } start(){ const ba=this.ba; ba.writeString('GIF89a'); ba.writeShort(this.w); ba.writeShort(this.h); ba.writeByte(0xF7); ba.writeByte(0); ba.writeByte(0); ba.writeBytes(this.palette); ba.writeByte(0x21); ba.writeByte(0xFF); ba.writeByte(11); ba.writeString('NETSCAPE2.0'); ba.writeByte(3); ba.writeByte(1); ba.writeShort(0); ba.writeByte(0); this.started=true; } addFrame({x=0,y=0,w=this.w,h=this.h,indices,delay=8,transparent=false,disposal=1}){ if(!this.started) this.start(); const ba=this.ba; ba.writeByte(0x21); ba.writeByte(0xF9); ba.writeByte(4); ba.writeByte((disposal << 2) | (transparent ? 1 : 0)); ba.writeShort(delay); ba.writeByte(0); ba.writeByte(0); ba.writeByte(0x2C); ba.writeShort(x); ba.writeShort(y); ba.writeShort(w); ba.writeShort(h); ba.writeByte(0); ba.writeByte(8); writeSubBlocks(ba,lzwRawEncode(indices)); } finish(){ this.ba.writeByte(0x3B); return this.ba.toBlob(); } }
function createCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function drawScaledPreviewCanvas(scale,absTime){ const c=createCanvas(Math.round(CANVAS_W*scale), Math.round(CANVAS_H*scale)); const cctx=c.getContext('2d',{willReadFrequently:true}); cctx.save(); cctx.scale(scale,scale); drawPreviewFrame(cctx,absTime,false); cctx.restore(); return c; }
function getDirtyRect(scale=1){
  const b = getBtn();
  const maxS = 1 + b.amp;
  const strokePad = (b.strokeW || 0) * maxS;
  const shinePad = b.shineOn ? b.h * 0.45 : 0;
  const shadowPad = (b.mode === 'basic' && getShadowStyle(b.shadowPreset)) ? 30 : 8;
  const pad = Math.ceil((strokePad + shinePad + shadowPad + b.h * b.amp) * scale);
  const cx = (b.x + b.w/2) * scale;
  const cy = (b.y + b.h/2) * scale;
  const w = b.w * maxS * scale;
  const h = b.h * maxS * scale;
  const x = Math.max(0, Math.floor(cx - w/2 - pad));
  const y = Math.max(0, Math.floor(cy - h/2 - pad));
  const x2 = Math.min(Math.round(CANVAS_W*scale), Math.ceil(cx + w/2 + pad));
  const y2 = Math.min(Math.round(CANVAS_H*scale), Math.ceil(cy + h/2 + pad));
  return {x,y,w:x2-x,h:y2-y};
}

function downloadBlob(blob,name){ const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1600); }

async function exportCompositeGIF(){
  if(isExporting) return;
  isExporting = true;
  setProgress(0);
  setStatus('导出中...');

  const btn = getBtn();
  const duration = btn.period;

  // 预览一致优先：先尝试更高帧率、更低抖动
  const plans = [
    {fps:18, dither:1, samples:7},
    {fps:15, dither:1, samples:7},
    {fps:12, dither:1, samples:6},
    {fps:10, dither:0, samples:5},
    {fps:8,  dither:0, samples:5},
    {fps:6,  dither:0, samples:4}
  ];

  try{
    let finalBlob = null;
    let smallestBlob = null;

    for(let p=0; p<plans.length; p++){
      const plan = plans[p];
      const frames = Math.max(6, Math.round(plan.fps * duration));
      const delay = Math.max(2, Math.round(100 / plan.fps));
      const w = CANVAS_W;
      const h = CANVAS_H;

      // 用多个时间点采样生成一张更稳定的全局色表，
      // 让导出渐变/扫光/描边更接近实时预览，而不是只取第 1 帧颜色。
      const palette = attachPaletteId(
        buildProtectedPaletteFromSampledFrames(
          (t)=>drawScaledPreviewCanvas(1, t * duration),
          plan.samples,
          true,
          getBtn(),
          'mixed'
        )
      );

      const writer = new GIFWriter(w, h, palette);
      const dirty = getDirtyRect(1);

      const first = drawScaledPreviewCanvas(1, 0);
      writer.addFrame({
        x:0, y:0, w, h,
        indices:canvasToIndexedAdaptive(first, 0, 0, w, h, palette, true, true, plan.dither),
        delay,
        transparent:true,
        disposal:1
      });

      for(let i=1; i<frames; i++){
        const phaseTime = (i / frames) * duration;
        const frame = drawScaledPreviewCanvas(1, phaseTime);

        writer.addFrame({
          x:dirty.x, y:dirty.y, w:dirty.w, h:dirty.h,
          indices:canvasToIndexedAdaptive(frame, dirty.x, dirty.y, dirty.w, dirty.h, palette, true, true, plan.dither),
          delay,
          transparent:true,
          disposal:3
        });

        setProgress((p/plans.length)*0.2 + ((i+1)/frames)*0.7);
        await new Promise(r=>setTimeout(r,0));
      }

      const blob = writer.finish();

      // 仍然优先尽可能压到约 2MB 内；
      // 如果所有方案都超出，就导出尝试结果里体积最小的那个，不再失败。
      if(!smallestBlob || blob.size < smallestBlob.size) smallestBlob = blob;
      if(blob.size <= TARGET_GIF_BYTES){
        finalBlob = blob;
        break;
      }
    }

    if(!finalBlob) finalBlob = smallestBlob;
    if(!finalBlob){
      setStatus('导出失败');
      return;
    }

    downloadBlob(finalBlob, `popup-${Date.now()}.gif`);
    setStatus(`已导出 ${Math.round(finalBlob.size/1024)}KB`);
  }catch(e){
    console.error(e);
    setStatus('导出失败');
  }finally{
    setProgress(null);
    isExporting = false;
  }
}

async function exportButtonOnlyGIF(){
  if(isExporting) return;
  isExporting = true;
  setProgress(0);
  setStatus('导出中...');

  const btn = getBtn();
  const duration = btn.period;

  const plans = [
    {fps:24, dither:1, samples:7},
    {fps:20, dither:1, samples:7},
    {fps:18, dither:1, samples:6},
    {fps:15, dither:0, samples:6},
    {fps:12, dither:0, samples:5},
    {fps:10, dither:0, samples:4}
  ];

  try{
    let finalBlob = null;
    let smallestBlob = null;
    const outW = BUTTON_ONLY_W;
    const outH = BUTTON_ONLY_H;

    for(let p=0; p<plans.length; p++){
      const plan = plans[p];
      const frames = Math.max(6, Math.round(plan.fps * duration));
      const delay = Math.max(2, Math.round(100 / plan.fps));

      // 用多个时间点采样按钮，避免按钮导出的颜色和预览不一致。
      const palette = attachPaletteId(
        buildProtectedPaletteFromSampledFrames(
          (t)=>{
            const c=createCanvas(outW, outH);
            const cctx=c.getContext('2d', {willReadFrequently:true});
            drawButtonOnlyFrame(cctx, t * duration, 1);
            return c;
          },
          plan.samples,
          true,
          getBtn(),
          'button'
        )
      );

      const writer = new GIFWriter(outW, outH, palette);

      for(let i=0; i<frames; i++){
        const c = createCanvas(outW, outH);
        const cctx = c.getContext('2d', {willReadFrequently:true});
        const phaseTime = (i / frames) * duration;
        drawButtonOnlyFrame(cctx, phaseTime, 1);

        writer.addFrame({
          x:0, y:0, w:outW, h:outH,
          indices:canvasToIndexedAdaptive(c, 0, 0, outW, outH, palette, true, true, plan.dither),
          delay,
          transparent:true,
          disposal:2
        });

        setProgress((p/plans.length)*0.2 + ((i+1)/frames)*0.7);
        await new Promise(r=>setTimeout(r,0));
      }

      const blob = writer.finish();

      if(!smallestBlob || blob.size < smallestBlob.size) smallestBlob = blob;
      if(blob.size <= TARGET_GIF_BYTES){
        finalBlob = blob;
        break;
      }
    }

    if(!finalBlob) finalBlob = smallestBlob;
    if(!finalBlob){
      setStatus('导出失败');
      return;
    }

    downloadBlob(finalBlob, `button-500x100-${Date.now()}.gif`);
    setStatus(`已导出 ${Math.round(finalBlob.size/1024)}KB`);
  }catch(e){
    console.error(e);
    setStatus('导出失败');
  }finally{
    setProgress(null);
    isExporting = false;
  }
}

if(els.exportMixBtn) els.exportMixBtn.onclick=exportCompositeGIF;
if(els.exportMixBtn2) els.exportMixBtn2.onclick=exportCompositeGIF;
